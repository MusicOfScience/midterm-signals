name: Admit certified result margins

on:
  workflow_dispatch:
  push:
    branches: [model-lab-polling-error]
    paths:
      - "scripts/admit_result_margins.py"
      - ".github/workflows/result-margin-admission.yml"

permissions:
  contents: write

concurrency:
  group: result-margin-admission-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Compile admission code
        run: python -m py_compile scripts/admit_result_margins.py
      - name: Admit certified outcome margins
        run: python scripts/admit_result_margins.py
      - name: Inspect sealed outputs
        run: |
          python - <<'PY'
          import csv, json
          p=json.load(open('historical/result-margin-provenance.json'))
          if p.get('evaluation_only') is not True or p.get('model_effect') != 'NONE':
              raise SystemExit('result-margin evaluation contract broken')
          r18=list(csv.DictReader(open('historical/2018/result-margins.csv', newline='')))
          r22=list(csv.DictReader(open('historical/2022/result-margins.csv', newline='')))
          src22=p['cycles']['2022']['sources'][0]
          unavailable=src22.get('margin_unavailable') or []
          if len(r18) != 470:
              raise SystemExit(f'unexpected 2018 margin rows {len(r18)}')
          if int(src22.get('source_districts_classified') or 0) != 435:
              raise SystemExit('2022 source did not classify all 435 districts')
          if len(r22) + len(unavailable) != 435:
              raise SystemExit(f'2022 numeric/unavailable partition drift: {len(r22)} + {len(unavailable)}')
          if any(float(r['dem_votes']) <= 0 or float(r['rep_votes']) <= 0 for r in r22):
              raise SystemExit('numeric 2022 margin emitted without both major-party vote totals')
          if not unavailable:
              raise SystemExit('expected explicit non-two-party unavailable rows in 2022')
          print('certified margins admitted', len(r18), len(r22), 'unavailable', len(unavailable))
          PY
      - name: Commit normalized outcome margins if changed
        shell: bash
        run: |
          git config user.name "midterm-signals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add historical/2018/result-margins.csv historical/2022/result-margins.csv historical/result-margin-provenance.json
          if git diff --cached --quiet; then
            echo "No certified margin change"
            exit 0
          fi
          git commit -m "data: admit certified historical result margins"
          git push
