name: Source health

on:
  workflow_dispatch:
  schedule:
    - cron: "47 1 * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public upstream input routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/ElectIndex/26_us_forecast_data/main"
          for file in races.csv historical.csv gcb_polls.csv race_polls.csv; do
            curl --fail --silent --show-error --location --max-time 30 "$base/$file" >/dev/null
            echo "healthy: $file"
          done
