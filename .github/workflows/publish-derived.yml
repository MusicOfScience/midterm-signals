name: Publish derived forecast

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/build_forecast.py"
      - "scripts/validate_forecast.py"
      - ".github/workflows/publish-derived.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build derived forecast
        run: python scripts/build_forecast.py
      - name: Validate forecast
        run: python scripts/validate_forecast.py
      - name: Commit derived artifacts if changed
        run: |
          if git diff --quiet -- public/data; then
            echo "Derived forecast already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "forecast: publish derived v0.1 snapshot [skip ci]"
          git push
