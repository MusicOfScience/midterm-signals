name: Publish observed 2026 election results

on:
  workflow_dispatch:
  # Ensure a first run after merge; output-only bot commits do not retrigger it.
  push:
    branches:
      - main
    # Publish on source/workflow changes after merge; cron covers regular updates.
    paths:
      - '.github/workflows/results-refresh.yml'
      - 'scripts/refresh_results_civic.py'
      - 'scripts/refresh_results.py'
      - 'tests/test_results_civic.py'
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  # Same group as forecast workflow: no simultaneous generated-data pushes.
  group: midterm-publication-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check parser/analysis invariants
        run: |
          python -m unittest tests.test_results_feed tests.test_results_civic
          node tests/results-core.test.mjs
      - name: Fetch licensed national civicAPI House/Senate observations
        run: python -m scripts.refresh_results_civic --strict-live
      - name: Publish only if the checked snapshot changed
        run: |
          git add public/data/observed-results.json
          if git diff --cached --quiet; then
            echo "No substantive vote update"
            exit 0
          fi
          git config user.name "midterm-signals-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: update observed 2026 election results"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Conflicting results changes require source review; never force-push." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Remote changed during observed-results publication; retrying $attempt/3" >&2
            sleep $((attempt * 2))
          done
          echo "Could not publish observed results safely" >&2
          exit 1
