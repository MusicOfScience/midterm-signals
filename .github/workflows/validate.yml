name: Validate MIDTERM SIGNALS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python syntax
        run: python -m py_compile scripts/build_forecast.py scripts/validate_forecast.py
      - name: JavaScript syntax
        run: node --check public/app.js && node --check public/core.mjs
      - name: Unit tests
        run: node tests/core.test.mjs && python -m unittest tests.test_model
      - name: Static publication checks
        run: node scripts/check.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: npm install --no-save playwright@1.49.1 axe-core@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static production server
        run: |
          python -m http.server 4173 --directory public > /tmp/midterm-server.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/midterm-server.log
          exit 1
      - name: Browser, mobile and accessibility tests
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/e2e.mjs
