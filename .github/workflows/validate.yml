name: Validate MIDTERM SIGNALS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python syntax
        run: python -m py_compile scripts/build_forecast.py scripts/validate_forecast.py
      - name: JavaScript syntax
        run: node --check public/app.js
      - name: Static publication checks
        run: node scripts/check.mjs
