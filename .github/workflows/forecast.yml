name: Refresh election forecast

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,12 * * *"
  push:
    branches: [main, prod-v1]
    paths-ignore:
      - "public/data/forecast.json"
      - "public/data/status.json"
      - "public/data/source-status.json"
      - "public/data/search.json"
      - "public/data/signals.json"
      - "public/data/results.json"
      - "public/data/run-report.json"
      - "public/data/races.csv"
      - "public/data/polls.csv"
      - "public/data/history/**"
      - "public/races/**"
      - "public/candidates/**"
      - "public/pollsters/**"
      - "public/sitemap.xml"
      - "public/robots.txt"

permissions:
  contents: write

concurrency:
  group: forecast-refresh
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build forecast snapshot and public routes
        run: python scripts/build_forecast.py
      - name: Validate numerical forecast
        run: python scripts/validate_forecast.py
      - name: Unit tests
        run: node tests/core.test.mjs && python -m unittest tests.test_model
      - name: Validate static publication
        run: node scripts/check.mjs
      - name: Commit forecast if changed
        shell: bash
        run: |
          git config user.name "midterm-signals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/ public/races/ public/candidates/ public/pollsters/ public/sitemap.xml public/robots.txt
          if git diff --cached --quiet; then
            echo "No forecast change"
            exit 0
          fi
          git commit -m "data: PROD v1.0 forecast refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
